services:
  postgres:
    image: postgres:latest
    container_name: faultlens-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: faultlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/18
    networks:
      - faultlens-network
  redis:
    image: redis:latest
    container_name: faultlens-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - faultlens-network

volumes:
  postgres_data:
  redis_data:
networks:
  faultlens-network:
    driver: bridge